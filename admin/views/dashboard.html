<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#1a1625',
                        'secondary': '#2d1b3d',
                        'accent': '#7c3aed',
                        'orange': '#f97316',
                        'dark': '#000000'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-6">
                <div>
                    <h1 class="text-2xl font-bold text-primary">Portfolio Admin</h1>
                    <p class="text-gray-600">Manage your portfolio content</p>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" target="_blank" class="text-accent hover:text-orange font-medium">View Site</a>
                    <button id="publish-btn" class="bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 text-white px-6 py-2 rounded-lg font-semibold transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl">
                        <span class="flex items-center space-x-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                            </svg>
                            <span>Publish Changes</span>
                        </span>
                    </button>
                    <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition-colors">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Success/Error Messages -->
        <div id="message-container" class="mb-6"></div>

        <!-- Navigation Tabs -->
        <div class="bg-white rounded-lg shadow mb-8">
            <div class="border-b border-gray-200">
                <nav class="flex space-x-8 px-6" aria-label="Tabs">
                    <button class="tab-btn active border-b-2 border-accent text-accent py-4 px-1 text-sm font-medium" data-tab="profile">
                        Profile Information
                    </button>
                    <button class="tab-btn border-b-2 border-transparent text-gray-500 hover:text-gray-700 py-4 px-1 text-sm font-medium" data-tab="about">
                        About Section
                    </button>
                    <button class="tab-btn border-b-2 border-transparent text-gray-500 hover:text-gray-700 py-4 px-1 text-sm font-medium" data-tab="experience">
                        Experience
                    </button>
                    <button class="tab-btn border-b-2 border-transparent text-gray-500 hover:text-gray-700 py-4 px-1 text-sm font-medium" data-tab="skills">
                        Skills & Achievements
                    </button>
                </nav>
            </div>

            <!-- Tab Contents -->
            <div class="p-6">
                <!-- Profile Tab -->
                <div id="profile" class="tab-content active">
                    <h2 class="text-xl font-semibold text-gray-900 mb-6">Profile Information</h2>
                    <form id="profile-form" class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                                <input type="text" name="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Professional Title</label>
                                <input type="text" name="title" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input type="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                                <input type="text" name="phone" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                                <input type="text" name="location" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Professional Description</label>
                            <textarea name="description" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"></textarea>
                        </div>
                        <button type="submit" class="bg-gradient-to-r from-accent to-orange text-white px-6 py-3 rounded-lg font-semibold hover:shadow-lg transition-all">
                            Update Profile
                        </button>
                    </form>
                </div>

                <!-- About Tab -->
                <div id="about" class="tab-content">
                    <h2 class="text-xl font-semibold text-gray-900 mb-6">About Section</h2>
                    <form id="about-form" class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Summary</label>
                            <textarea name="summary" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Detailed Description</label>
                            <textarea name="description" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"></textarea>
                        </div>
                        
                        <div class="border-t pt-6">
                            <h3 class="text-lg font-medium text-gray-900 mb-4">Education</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Degree</label>
                                    <input type="text" name="education.degree" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Institution</label>
                                    <input type="text" name="education.institution" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Years</label>
                                    <input type="text" name="education.years" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                                </div>
                            </div>
                            <div class="mt-4">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Education Description</label>
                                <textarea name="education.description" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent"></textarea>
                            </div>
                        </div>

                        <div class="border-t pt-6">
                            <h3 class="text-lg font-medium text-gray-900 mb-4">Certifications</h3>
                            <div id="certifications-container">
                                <!-- Certifications will be loaded here -->
                            </div>
                            <button type="button" id="add-certification" class="mt-4 text-accent hover:text-orange font-medium">+ Add Certification</button>
                        </div>

                        <button type="submit" class="bg-gradient-to-r from-accent to-orange text-white px-6 py-3 rounded-lg font-semibold hover:shadow-lg transition-all">
                            Update About Section
                        </button>
                    </form>
                </div>

                <!-- Experience Tab -->
                <div id="experience" class="tab-content">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-semibold text-gray-900">Professional Experience</h2>
                        <button id="add-experience" class="bg-gradient-to-r from-accent to-orange text-white px-4 py-2 rounded-lg font-medium hover:shadow-lg transition-all">
                            + Add Experience
                        </button>
                    </div>
                    <div id="experience-list" class="space-y-6">
                        <!-- Experience items will be loaded here -->
                    </div>
                </div>

                <!-- Skills Tab -->
                <div id="skills" class="tab-content">
                    <h2 class="text-xl font-semibold text-gray-900 mb-6">Skills & Achievements</h2>
                    
                    <div class="space-y-8">
                        <!-- Skills Section -->
                        <div>
                            <h3 class="text-lg font-medium text-gray-900 mb-4">Technical Skills</h3>
                            <div id="skills-container" class="space-y-3">
                                <!-- Skills will be loaded here -->
                            </div>
                            <button type="button" id="add-skill" class="mt-4 text-accent hover:text-orange font-medium">+ Add Skill</button>
                        </div>

                        <!-- Achievements Section -->
                        <div class="border-t pt-6">
                            <h3 class="text-lg font-medium text-gray-900 mb-4">Key Achievements</h3>
                            <form id="achievements-form" class="space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Customer Satisfaction Improvement</label>
                                        <input type="text" name="customerSatisfaction" placeholder="30%" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Operational Efficiency</label>
                                        <input type="text" name="operationalEfficiency" placeholder="25%" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Years of Experience</label>
                                        <input type="text" name="experience" placeholder="5+" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                                    </div>
                                </div>
                                <button type="submit" class="bg-gradient-to-r from-accent to-orange text-white px-6 py-3 rounded-lg font-semibold hover:shadow-lg transition-all">
                                    Update Achievements
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Experience Modal -->
    <div id="experience-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-2xl mx-4 max-h-96 overflow-y-auto">
            <h3 class="text-lg font-semibold mb-4">Edit Experience</h3>
            <form id="experience-form" class="space-y-4">
                <input type="hidden" name="id">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Job Title</label>
                        <input type="text" name="title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Company</label>
                        <input type="text" name="company" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                        <input type="text" name="location" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Start Date</label>
                        <input type="text" name="startDate" placeholder="January 2021" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">End Date</label>
                        <input type="text" name="endDate" placeholder="Present" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" name="current" id="current-job" class="rounded border-gray-300 text-accent focus:ring-accent">
                        <label for="current-job" class="ml-2 text-sm text-gray-700">Current Position</label>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Key Achievements</label>
                    <div id="achievements-list" class="space-y-2">
                        <!-- Achievement inputs will be added dynamically -->
                    </div>
                    <button type="button" id="add-achievement" class="mt-2 text-accent hover:text-orange font-medium">+ Add Achievement</button>
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" id="cancel-experience" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
                    <button type="button" id="delete-experience" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 hidden">Delete</button>
                    <button type="submit" class="px-4 py-2 bg-gradient-to-r from-accent to-orange text-white rounded-lg hover:shadow-lg">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin/js/dashboard.js"></script>
</body>
</html>
